[project]
name = "surveycontroller"
version = "3.2.0"
description = "SurveyController desktop application"
readme = "README.md"
requires-python = ">=3.13.16"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27,<1",
    "keyring>=25,<26; sys_platform == 'darwin'",
    "openpyxl",
    "packaging",
    "PySide6==6.11.1",
    "PySide6-Fluent-Widgets==1.11.2",
    "surveycore-py",
    "zxing-cpp",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.17",
]
build = [
    "nuitka>=4.1.2,<5",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
surveycore-py = { git = "https://github.com/SurveyController/surveycore-py", rev = "6c3c72bde24db8133800c7185fd9aeceb627acf9" }

[tool.ruff]
line-length = 100
