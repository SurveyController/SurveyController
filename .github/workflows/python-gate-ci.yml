name: Python Runtime Gates

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: python-gate-ci-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  import-check:
    name: Import Smoke Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run module import check
        run: uv run python -m CI.python_checks.import_check

  window-smoke:
    name: Window Smoke Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run main window smoke check
        run: uv run python -m CI.python_checks.window_smoke_check

  import-and-window-smoke:
    name: Import And Window Smoke
    if: ${{ always() }}
    needs:
      - import-check
      - window-smoke
    runs-on: windows-latest

    steps:
      - name: Verify import and window smoke checks
        shell: powershell
        run: |
          $importResult = "${{ needs.import-check.result }}"
          $windowResult = "${{ needs.window-smoke.result }}"
          Write-Host "Import smoke result: $importResult"
          Write-Host "Window smoke result: $windowResult"
          if ($importResult -ne "success" -or $windowResult -ne "success") {
            throw "Import or window smoke check did not pass."
          }
